apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// The version comes from package.json, so the native build always matches the
// web app. versionCode = major*1000000 + minor*10000 + patch*100 (0.1.0 ->
// 10000), the family's scheme: it rises with every release and leaves 100
// spare codes per patch.
def pkg = new groovy.json.JsonSlurper().parse(rootProject.file("../package.json"))
def baseVersionName = pkg.version as String
def versionParts = baseVersionName.tokenize('.')
def derivedVersionCode = versionParts[0].toInteger() * 1000000 + versionParts[1].toInteger() * 10000 + versionParts[2].toInteger() * 100

// A one-off code for a pre-release upload: Play wants every upload to carry a
// higher code than any before it, on any track.
//   ./gradlew bundleRelease -PappVersionCode=10001
def appVersionCode = (project.findProperty("appVersionCode") ?: derivedVersionCode).toString().toInteger()

// Release signing reads android/keystore.properties, which is not in the
// repository. Without it (a debug build, CI with no secrets) release builds
// are left unsigned.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.thingglance.app"
    compileSdk = rootProject.ext.compileSdkVersion
    // The home-screen widgets are Jetpack Glance: Kotlin and Compose.
    buildFeatures {
        compose true
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    defaultConfig {
        applicationId "com.thingglance.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName baseVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Stays off: plugin bridges are found by reflection, and widget
            // icons by name. lastGLANCE learned both.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Home-screen widgets.
    implementation "androidx.glance:glance-appwidget:$glanceVersion"
    implementation "androidx.glance:glance-material3:$glanceVersion"
    // The native reader for the vault's event stream (sse/VaultSseClient.kt).
    // Already present through Glance; named here so that cannot change it.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    // The real org.json for unit tests on the JVM: android.jar's copy is a stub.
    testImplementation "org.json:json:20240303"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
