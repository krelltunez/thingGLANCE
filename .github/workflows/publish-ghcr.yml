name: Publish to GHCR

on:
  release:
    types:
      - published
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # The Dockerfile's build stage is pinned to the runner's own platform, so
    # npm ci and the Vite build run once, natively, and only the nginx layer
    # differs per architecture. Keep it that way: npm ci under QEMU can
    # deadlock with no output (lastGLANCE's v2.6.0 release run sat for five and
    # a half hours). A healthy run takes a few minutes, so half an hour turns a
    # hang into a visible failure. Recover with "Re-run all jobs" on the failed
    # run, which keeps the release event and so the version tags; a manual run
    # from main only publishes the :main and :sha-* tags.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Nothing in the runtime stage executes today (it only copies files), so
      # this is a guard for the day a RUN is added there.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
