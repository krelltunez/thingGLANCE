server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Container health check. Answered by nginx itself, never the app.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The service worker, its Workbox runtime and the page that loads them must
    # never be cached, or an update cannot reach an installed app.
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~ ^/workbox-[^/]+\.js$ {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        expires off;
        add_header Cache-Control "no-cache";
    }

    # Vite's output: every filename carries a content hash, so it can be cached
    # for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Icons and favicons keep their names between releases: cache briefly.
    location ~* \.(?:png|svg|ico|webp)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback: every other path serves the app, so deep links work.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
