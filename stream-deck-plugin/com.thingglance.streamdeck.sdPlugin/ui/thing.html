<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The Thing key's settings: which thing it shows. The list comes from the
       plugin over Stream Deck's own channel (actions/thing.ts, onSendToPlugin);
       this page never connects to thingGLANCE itself. -->
  <style>
    body { margin: 0; padding: 8px 12px; font: 13px -apple-system, 'Segoe UI', sans-serif; color: #d6d6d6; background: #2d2d2d; }
    label { display: block; margin: 4px 0 6px; color: #969696; }
    select { width: 100%; padding: 4px; background: #3d3d3d; color: #d6d6d6; border: 1px solid #4d4d4d; border-radius: 3px; font: inherit; }
    p { margin: 8px 0 0; color: #969696; line-height: 1.4; }
  </style>
</head>
<body>
  <label for="thing">Thing</label>
  <select id="thing" disabled><option>Loading…</option></select>
  <p id="note"></p>
  <script>
    let socket = null, context = null, action = null, settings = {}, retry = null;
    const select = document.getElementById('thing'), note = document.getElementById('note');

    function send(msg) { if (socket && socket.readyState === 1) socket.send(JSON.stringify(msg)); }
    function ask() { send({ event: 'sendToPlugin', action, context, payload: { event: 'tg-list-things' } }); }

    function show(list, connected) {
      select.textContent = '';
      if (!connected) {
        select.disabled = true;
        select.append(new Option('thingGLANCE is not running'));
        note.textContent = 'Open thingGLANCE and turn on Stream Deck in Settings, then Integrations.';
        clearTimeout(retry); retry = setTimeout(ask, 3000);
        return;
      }
      note.textContent = 'Left on the first choice, the key shows whichever thing is closest to the end of its window.';
      select.disabled = false;
      select.append(new Option('Closest to the end of its window', ''));
      for (const t of [...list].sort((a, b) => a.name.localeCompare(b.name))) select.append(new Option(t.name, t.id));
      if (settings.thingId && !list.some((t) => t.id === settings.thingId)) select.append(new Option('(a thing that is no longer tracked)', settings.thingId));
      select.value = settings.thingId || '';
    }

    select.addEventListener('change', () => {
      settings = { ...settings, thingId: select.value || undefined };
      send({ event: 'setSettings', context, payload: settings });
    });

    // Called by Stream Deck when the inspector opens.
    window.connectElgatoStreamDeckSocket = (port, uuid, registerEvent, _info, actionInfo) => {
      context = uuid;
      const info = JSON.parse(actionInfo);
      action = info.action;
      settings = (info.payload && info.payload.settings) || {};
      socket = new WebSocket(`ws://127.0.0.1:${port}`);
      socket.onopen = () => { send({ event: registerEvent, uuid }); ask(); };
      socket.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.event === 'sendToPropertyInspector' && msg.payload && msg.payload.event === 'tg-things') show(msg.payload.things || [], msg.payload.connected);
        if (msg.event === 'didReceiveSettings') { settings = msg.payload.settings || {}; select.value = settings.thingId || ''; }
      };
    };
  </script>
</body>
</html>
