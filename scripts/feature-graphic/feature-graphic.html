<!doctype html>
<!--
  The Google Play feature graphic (1024x500), in the family's layout
  (lastGLANCE's scripts/feature-graphic): the app icon, then the wordmark and a
  tagline, on the family's night colour. The wordmark is the app's own
  (components/ui.tsx): "thing" in Inter 800, "GLANCE" in Inter 800 italic in
  the sky accent. Colours are the dark theme's (src/index.css).
  render.mjs turns this into store-assets/play/feature-graphic.png.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:'Inter';font-weight:100 900;font-style:normal;font-display:block;src:url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2')}
  @font-face{font-family:'Inter';font-weight:100 900;font-style:italic;font-display:block;src:url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-italic.woff2') format('woff2')}
  html,body{margin:0;padding:0;width:1024px;height:500px;background:#05081A;overflow:hidden}
  .canvas{width:1024px;height:500px;background:#05081A;position:relative;overflow:hidden;font-family:'Inter',sans-serif}
  /* The family's vignette, with the app's own backdrop over it: a sky glow from the top and a faint dot grid. */
  .vignette{position:absolute;inset:0;background:radial-gradient(62% 72% at 40% 44%, #0d1633 0%, #070b1f 58%, #05081A 100%)}
  .glow{position:absolute;inset:0;background:radial-gradient(ellipse 70% 300px at 50% -90px, rgba(56,189,248,0.13), transparent 70%)}
  .grid{position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px, rgba(148,197,255,0.07) 1px, transparent 0);background-size:24px 24px}
  .row{position:absolute;inset:0;display:flex;align-items:center;padding-left:68px;gap:40px}
  .icon{width:204px;height:204px;flex:none;border-radius:37px;box-shadow:0 0 0 1px rgba(148,197,255,0.08), 0 8px 24px rgba(0,0,0,0.45)}
  .text{display:flex;flex-direction:column;justify-content:center}
  .wm{font-size:96px;line-height:1;letter-spacing:-3.6px;white-space:nowrap}
  .wm .thing{color:#E8F0FC;font-weight:800}
  .wm .glance{color:#38BDF8;font-style:italic;font-weight:800;text-shadow:0 0 28px rgba(56,189,248,0.35)}
  .tag{margin-top:20px;font-weight:500;font-size:26px;letter-spacing:-0.3px;color:#96A6C4}
</style>
</head>
<body>
  <div class="canvas">
    <div class="vignette"></div>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="row">
      <img class="icon" src="../../public/icons/icon.svg" width="204" height="204">
      <div class="text">
        <div class="wm"><span class="thing">thing</span><span class="glance">GLANCE</span></div>
        <div class="tag">what's next for your things?</div>
      </div>
    </div>
  </div>
</body>
</html>
